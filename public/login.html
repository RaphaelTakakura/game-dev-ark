<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title> Login </title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">

</head>

<body>

    <div class="header">
        
        <span class="logo"> < <a href="index.html"> game-dev-ark </a> > </span>
        
        <ul class="navbar">
            <li>
                <a href="index.html"> Home </a>
            </li>
            <li>
                <a href="artigoMain.html"> Artigos </a>
            </li>
            <li>
                <a href="cadastro.html"> Cadastro </a>
            </li>
            <li>
                <span style="color: rgb(230, 2, 127); font-weight: bold; cursor: default;"> Login </span>
            </li>
        </ul>

    </div>

    <div class="formulario_login">
        
        <span style="font-size: 30px; padding: 10px; color: rgb(230, 2, 127);"> < <span style="color:white"> Login </span> > </span>
        <br>
        <span> E-mail : </span>
        <input type="text" id="inp_usuario">
        <div id="div_erro_usuario" class="texto_erro"></div>
        <br>
        <span> Senha : </span>
        <input type="password" id="inp_senha">
        <div id="div_erro_senha" class="texto_erro"></div>
        <br>
        <button onclick="Login()" type="button"> Entrar </button>
    
    </div>

    <div class="footer">
        <span>Esse projeto utiliza códigos do <a href="https://github.com/BandTec/web-data-viz" class="classe_padronizacao_links"> web-data-viz </a></span>
    </div>
    
</body>

</html>

<script>

    function Login() {

        var usuario = inp_usuario.value;
        var senha = inp_senha.value;

        div_erro_senha = ``
        div_erro_usuario = ``

        if (usuario == "") {
            div_erro_usuario.innerHTML = `INSIRA UM USUÁRIO`
        }
        else if (senha == "") {
            div_erro_senha.innerHTML = `INSIRA UMA SENHA`
        }

        console.log("FORM LOGIN: ", usuario);
        console.log("FORM SENHA: ", senha);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                usuario,
                senha
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);
                alert('Login realizado com sucesso! Redirecionando para seu perfil...')
                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.USER_USUARIO = json.usuario;
                    sessionStorage.ID_USUARIO = json.id;

                    window.location = "./dashboard/dashboard.html";
                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

</script>
